    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">

                <div class="card">
                    <div class="card-header text-center">
                        <h3>Register as Legal Service Provider</h3>
                    </div>
                    <div class="card-body">
                        <form id="lsp_registration_form" action="/register/lsp" method="POST">
                            <div class="form-group">
                                <label for="fullname">Full Name</label>
                                <input type="text" class="form-control" id="fullname" name="fullname" required>
                            </div>
                            <div class="form-group">
                                <label for="username">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="form-group">
                                <label for="email">Email Address</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div class="form-group">
                                <label for="confirm_password">Confirm Password</label>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                            </div>
                            <div class="form-group">
                                <label for="phonenumber">Phone Number</label>
                                <input type="text" class="form-control" id="phonenumber" name="phone_number" required>
                            </div>
                            <div class="form-group">
                                <label for="bar_association_number">Enrolment Number</label>
                                <input type="text" class="form-control" id="bar_association_number" name="bar_association_number" required>
                            </div>
                            <div class="form-group">
                                <label for="practice_area">Practice Areas (e.g., Civil, Criminal, Corporate)</label>
                                <textarea class="form-control" id="practice_area" name="practice_area" rows="2" required></textarea>
                            </div>
                            <div class="form-group">
                                <label for="language_comfortable">Languages Spoken</label>
                                <input type="text" class="form-control" id="language_comfortable" name="language_comfortable" required>
                            </div>
                            <div class="form-group">
                                <label for="profile_description">Profile Description</label>
                                <textarea class="form-control" id="profile_description" name="profile_description" rows="3" required></textarea>
                            </div>
                            <div class="form-group">
                                <label for="state">State</label>
                                <select class="form-control" id="state" name="state" required>
                                    <option value="">Select State</option>
                                    <option value="Andhra Pradesh">Andhra Pradesh</option>
                                    <option value="Maharashtra">Maharashtra</option>
                                    <option value="Tamil Nadu">Tamil Nadu</option>
                                    <option value="Karnataka">Karnataka</option>
                                    <option value="Delhi">Delhi</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="city">City</label>
                                <select class="form-control" id="city" name="city" required>
                                    <option value="">Select City</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="consultation_type">Consultation Type</label>
                                <select class="form-control" id="consultation_type" name="consultation_type" required>
                                    <option value="online">Online</option>
                                    <option value="offline">Offline</option>
                                    <option value="both">Both</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="linkedin_link">LinkedIn Profile</label>
                                <input type="url" class="form-control" id="linkedin_link" name="linkedin_link">
                            </div>
                            <div class="form-group">
                                <label for="google_meet_link">Google Meet Link</label>
                                <input type="url" class="form-control" id="google_meet_link" name="google_meet_link">
                            </div>
                            
                            <div class="form-group">
                                <label for="location">Full Address</label>
                                <textarea class="form-control" id="location" name="location" required></textarea>
                            </div>
                            
                            <div class="form-group">
                                <label for="court_jurisdiction">Court of Jurisdiction</label>
                                <input type="text" class="form-control" id="court_jurisdiction" name="court_jurisdiction" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="cases_solved">Number of Cases Solved</label>
                                <input type="number" class="form-control" id="cases_solved" name="cases_solved" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="years_experience">Years of Experience</label>
                                <input type="number" class="form-control" id="years_experience" name="years_experience" required>
                            </div>

                            <!-- OTP Section -->
                            <div class="form-group">
                                <label for="otp">Enter OTP</label>
                                <input type="text" class="form-control" id="otp" name="otp" required>
                            </div>

                            <button type="button" id="send_otp" class="btn btn-info">Send OTP</button>
                            <button type="button" id="verify_otp" class="btn btn-info">Verify OTP</button>


                            <button type="submit" class="btn btn-primary">Register</button>
                        </form>
                    </div>
                    <div class="card-footer text-center">
                        <a href="index.html">Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script>
        const cityOptions = {
            "Andhra Pradesh": ["Visakhapatnam", "Vijayawada", "Guntur", "Tirupati"],
            "Maharashtra": ["Mumbai", "Pune", "Nagpur", "Nashik"],
            "Tamil Nadu": ["Chennai", "Coimbatore", "Madurai", "Salem"],
            "Karnataka": ["Bangalore", "Mysore", "Mangalore", "Hubli"],
            "Delhi": ["New Delhi", "Dwarka", "Rohini", "Saket"]
        };

    $(document).ready(function () {
        // State and city dropdown
        const cityOptions = {
            "Andhra Pradesh": ["Visakhapatnam", "Vijayawada", "Guntur", "Tirupati"],
            "Maharashtra": ["Mumbai", "Pune", "Nagpur", "Nashik"],
            "Tamil Nadu": ["Chennai", "Coimbatore", "Madurai", "Salem"],
            "Karnataka": ["Bangalore", "Mysore", "Mangalore", "Hubli"],
            "Delhi": ["New Delhi", "Dwarka", "Rohini", "Saket"]
        };

        $('#state').change(function () {
            let state = $(this).val();
            let cities = cityOptions[state] || [];
            $('#city').empty().append('<option value="">Select City</option>');
            cities.forEach(city => {
                $('#city').append(`<option value="${city}">${city}</option>`);
            });
        });

        // OTP sending functionality
        $('#send_otp').click(function () {
            const email = $('#email').val();
            $.ajax({
                url: '/send_otp_lsp',
                method: 'POST',
                data: JSON.stringify({ email: email }),
                contentType: 'application/json',
                success: function (response) {
                    alert(response.message);
                },
                error: function (err) {
                    alert(err.responseJSON.message);
                }
            });
        });

        // OTP verification functionality
        $('#verify_otp').click(function () {
            const otp = $('#otp').val();
            $.ajax({
                url: '/verify_otp_lsp',
                method: 'POST',
                data: JSON.stringify({ otp: otp }),
                contentType: 'application/json',
                success: function (response) {
                    alert(response.message);
                    if (response.status === 'success') {
                        $('#verify_otp').prop('disabled', true); // Disable OTP verify button after successful verification
                        $('#send_otp').prop('disabled', true); // Disable send OTP button after successful verification
                        $('#register_btn').prop('disabled', false); // Enable register button after OTP verification
                    }
                },
                error: function (err) {
                    alert(err.responseJSON.message);
                }
            });
        });

        // Handle form submission after OTP verification
        $('#lsp_registration_form').submit(function (e) {
            e.preventDefault(); // Prevent the form from submitting the usual way

            // Check if OTP is verified before submitting
            if ($('#verify_otp').prop('disabled')) {
                $.ajax({
                    url: '/register/lsp',
                    method: 'POST',
                    data: $(this).serialize(), // Serialize the form data
                    success: function (response) {
                        alert(response.message);
                        if (response.message === "LSP registered successfully!") {
                            window.location.href = '/'; // Redirect to login or another page after successful registration
                        }
                    },
                    error: function (err) {
                        alert(err.responseJSON.message); // Display any error message from backend
                    }
                });
            } else {
                alert('Please verify the OTP before submitting the form!');
            }
        });

    });
