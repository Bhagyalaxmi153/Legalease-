<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LegalEase - Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
      background: linear-gradient(135deg, #333, #e0e0e0); /* Gradient from greyish black to light grey */
    }

    .container {
      max-width: 600px;
      width: 100%;
      background-color: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.15);
    }

    .container h1 {
      text-align: center;
      font-size: 24px;
      font-weight: 500;
      margin-bottom: 20px;
      position: relative;
    }

    .container h1::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -5px;
      width: 50px;
      height: 3px;
      background: linear-gradient(135deg, #000000, #ffffff);
      transform: translateX(-50%);
      border-radius: 5px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      font-weight: 500;
      display: block;
      margin-bottom: 5px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border-radius: 25px;
      border: 1px solid #ccc;
      box-shadow: 1px 1px 2px black;
      outline: none;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #9b59b6;
    }

    .form-group select {
      background-color: #f8f9fa; /* Light grey background */
    }

    /* Style for the selected option in the dropdown */
    .form-group select option:checked {
      background-color: #333; /* Dark grey background when selected */
      color: white; /* White text color */
    }

    /* Style for the option elements inside the dropdown */
    .form-group select option {
      background-color: #f8f9fa; /* Light grey background for options */
      color: #495057; /* Dark text color for options */
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      border-radius: 25px;
      border: none;
      text-shadow: 1px 1px black;
      box-shadow: 1px 1px 2px black;
      color: #fff;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: linear-gradient(135deg, #000000, #ffffff);
    }

    .btn-submit:hover {
      transform: scale(0.98);
    }

    @media (max-width: 500px) {
      .container {
        padding: 20px;
      }
    }

    /* Positioning the language selector at the top-left corner */
    .language-selector {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000; /* Ensures it stays on top of other elements */
    }

  </style>
</head>
<body>

  <!-- Language Selector -->
  <div class="language-selector">
    <div id="google_translate_element"></div>
  </div>

  <!-- Form Container -->
  <div class="container">
    <h1>Login</h1>

    <form id="loginForm" action="/login" method="POST">
      <div class="form-group">
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
      </div>

      <div class="form-group">
        <label for="user_type">I am a</label>
        <select id="user_type" name="user_type" required>
          <option value="client">Client</option>
          <option value="lsp">Service Provider (LSP)</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">Login</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(event) {
      event.preventDefault();  // Prevent form from submitting normally

      const formData = new FormData(event.target);

      try {
        console.log("Sending login request...");
        const response = await fetch('http://127.0.0.1:5000/login', {  // Ensure correct URL
          method: 'POST',
          body: formData
        });

        console.log("Response received:", response);

        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const result = await response.json();
        console.log("Result:", result);

        if (result.status === 'success') {
          window.location.href = result.redirect_url;  // Redirect if login is successful
        } else {
          alert(result.message || 'Invalid login credentials. Please try again.');
        }
      } catch (error) {
        console.error("Login failed:", error);
        alert("An error occurred. Please check the console for details.");
      }
    });

    function checkLoginStatus() {
      fetch('/check_login')
        .then(response => response.json())
        .then(data => {
          if (data.logged_in) {
            document.getElementById('registerClient').style.display = 'none';
            document.getElementById('registerLSP').style.display = 'none';
            document.getElementById('loginLink').style.display = 'none';

            document.getElementById('userSection').style.display = 'block';
            document.getElementById('logoutSection').style.display = 'block';

            document.getElementById('usernameDisplay').innerText = data.username || "User";
            document.getElementById('userEmail').innerText = data.email || "Not Available";
            document.getElementById('userType').innerText = data.user_type || "Not Specified";
          }
        })
        .catch(error => console.error("Error checking login status:", error));
    }

    window.onload = checkLoginStatus;
  </script>
</body>
</html>
